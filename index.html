<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LEGACY APDFL 18 API Reference</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      color: #333;
      background: #eee;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .card {
      background: #fff;
      border: 1px solid #ccc;
      padding: 48px 44px;
      max-width: 480px;
      width: 100%;
    }

    .badge {
      display: inline-block;
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #666;
      background: #e8e8e8;
      border: 1px solid #ccc;
      padding: 3px 8px;
      margin-bottom: 16px;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #666;
      font-size: 0.9rem;
      margin-bottom: 32px;
    }

    .links {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .links a {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
      border: 1px solid #ccc;
      background: #fafafa;
      color: #333;
      text-decoration: none;
      font-weight: 500;
      font-size: 0.95rem;
    }

    .links a:hover {
      background: #e8e8e8;
    }

    .links a::after {
      content: "\2192";
      color: #999;
    }

    .links a:hover::after {
      color: #333;
    }
  </style>
</head>
<body>
  <div class="card">
    <span class="badge">Legacy</span>
    <h1>APDFL 18</h1>
    <p class="subtitle">API Reference Documentation</p>
    <ul class="links">
      <li><a href="http://legacy-docs.datalogics.com/apdfl18/DotNet/index.html">.NET</a></li>
      <li><a href="http://legacy-docs.datalogics.com/apdfl18/DotNetFramework/index.html">.NET Framework</a></li>
      <li><a href="http://legacy-docs.datalogics.com/apdfl18/CPlusPlus/API_Reference.html">C++</a></li>
      <li><a href="http://legacy-docs.datalogics.com/apdfl18/Java/index.html">Java</a></li>
    </ul>
  </div>
</body>
</html>
